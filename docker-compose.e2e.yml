# The database of the browser tests (frontend/e2e). It keeps its data in memory and is recreated before every
# test run, so each run begins with an empty store. It is a separate file so it needs no .env, which CI has not.
name: furniture-ecommerce-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: furniture_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d furniture_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
